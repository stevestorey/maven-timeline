name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Building needs JDK 17+ (JUnit 6); the extension itself targets Java 8
        java: [17, 21, 25]
    name: Build on JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
