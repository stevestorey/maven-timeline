name: Release

# Publishing a GitHub Release whose tag is v<version> (for example v1.2.0) builds that version,
# signs it and uploads it to Maven Central through the Central Portal.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The secrets live in this environment, which only v* tags may deploy from
    environment: maven-central-release
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not of the form v1.2.3"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
          cache: maven
          # Writes a settings.xml server "central" that reads the token from these variables
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD

      - name: Build, sign and publish ${{ steps.version.outputs.version }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B -ntp -Prelease -Drevision="$VERSION" deploy
